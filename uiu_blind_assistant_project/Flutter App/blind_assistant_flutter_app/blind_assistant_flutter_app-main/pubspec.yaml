name: blind_assistant
description: "AI-powered assistive application for visually impaired users."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # Communication with Python/YOLO server
  http: ^1.6.0

  # Text-to-speech
  flutter_tts: ^4.2.5

  # GPS/location
  geolocator: ^14.0.3

  # Voice command recognition
  speech_to_text: ^7.4.0

  # Save server IP, language, SOS number, etc.
  shared_preferences: ^2.5.5


  # SMS composer fallback
  url_launcher: ^6.3.2
  translator: ^1.0.4+1
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true